[world]
name = "Stake Wars (Sepolia Sectors v4)"
description = "Stake Wars core sector-control world on Starknet Sepolia"
website = "https://stakewars.gg"
seed = "stakewars-sepolia-sectors-v4"
# Initialize GameConfig.minimum_stake with 100000000000000000 (0.1 STRK).
# Initialize GameConfig.challenge_period_seconds with 180 (3 minutes).

[world.socials]
github = "https://github.com/broody/stake-wars"

[namespace]
default = "stakewars"

[env]
rpc_url = "https://api.cartridge.gg/x/starknet/sepolia/rpc/v0_9"
account_address = "0x3209826d1cdd1ff0f034b64f2df829d9bd39d62f6ec2ab913a32c741b6a7119"

