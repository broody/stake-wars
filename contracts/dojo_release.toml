[world]
name = "Stake Wars"
description = "Stake Wars core territory-control world"
website = "https://stakewars.gg"
seed = "stakewars-mainnet"
# Initialize GameConfig.minimum_stake with 100000000000000000000 (100 STRK).
# Initialize the legacy GameConfig.challenge_period_seconds (no gameplay effect) with 10800 (3 hours).

[world.socials]
github = "https://github.com/broody/stake-wars"

[namespace]
default = "stakewars"

# Public Mainnet discovery settings. The account and signing credentials remain
# outside version control and are supplied only for an approved deployment.

[env]
rpc_url = "https://rpc.stakewars.gg/rpc/v0_9"
world_address = "0x6e2d33ac9878de85acc676347f6bd97a860376fe33438eb7445317a6b1d71cc"
world_block = 14066846

[writers]
"stakewars-SupplyDropHold" = ["stakewars-supply_drop", "stakewars-control"]
"stakewars-SupplyDropStakingPolicy" = ["stakewars-supply_drop"]
"stakewars-SupplyDropClaimHoldCreated" = ["stakewars-supply_drop"]
"stakewars-SupplyDropHoldCleared" = ["stakewars-control"]
"stakewars-GameConfig" = ["stakewars-admin"]
"stakewars-OperatorState" = ["stakewars-control"]
"stakewars-Sector" = ["stakewars-control"]
"stakewars-SupplyDropCounter" = ["stakewars-supply_drop"]
"stakewars-SupplyDrop" = ["stakewars-supply_drop"]
"stakewars-SupplyDropSectorSnapshot" = ["stakewars-control"]
"stakewars-SupplyDropOperatorSnapshot" = ["stakewars-control"]
"stakewars-ConfigInitialized" = ["stakewars-admin"]
"stakewars-PauseChanged" = ["stakewars-admin"]
"stakewars-RulesChanged" = ["stakewars-admin"]
"stakewars-StakingPoolChanged" = ["stakewars-admin"]
"stakewars-AdminTransferred" = ["stakewars-admin"]
"stakewars-SectorCaptured" = ["stakewars-control"]
"stakewars-SectorTakenOver" = ["stakewars-control"]
"stakewars-SectorReinforced" = ["stakewars-control"]
"stakewars-SectorReleased" = ["stakewars-control"]
"stakewars-OperatorDisqualified" = ["stakewars-control"]
"stakewars-OperatorRetired" = ["stakewars-control"]
"stakewars-SupplyDropCreated" = ["stakewars-supply_drop"]
