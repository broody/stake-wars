[world]
name = "StakeWars"
description = "StakeWars core territory-control world"
website = "https://stakewars.gg"
seed = "stakewars-mainnet"
# Initialize GameConfig.minimum_stake with 100000000000000000000 (100 STRK).

[world.socials]
github = "https://github.com/broody/stake-wars"

[namespace]
default = "stakewars"

# Mainnet RPC, account, keystore, and world address are intentionally supplied
# outside version control when a deployment is explicitly approved.

[writers]
"stakewars-GameConfig" = ["stakewars-admin"]
"stakewars-OperatorState" = ["stakewars-control"]
"stakewars-ControlPoint" = ["stakewars-control"]
"stakewars-ChallengeCounter" = ["stakewars-control"]
"stakewars-Challenge" = ["stakewars-control"]
"stakewars-ChallengeParticipant" = ["stakewars-control"]
"stakewars-ConfigInitialized" = ["stakewars-admin"]
"stakewars-PauseChanged" = ["stakewars-admin"]
"stakewars-RulesChanged" = ["stakewars-admin"]
"stakewars-StakingPoolChanged" = ["stakewars-admin"]
"stakewars-AdminTransferred" = ["stakewars-admin"]
"stakewars-ControlPointCaptured" = ["stakewars-control"]
"stakewars-ControlPointReinforced" = ["stakewars-control"]
"stakewars-ControlPointReleased" = ["stakewars-control"]
"stakewars-ChallengeStarted" = ["stakewars-control"]
"stakewars-BidPlaced" = ["stakewars-control"]
"stakewars-ControlPointSacrificed" = ["stakewars-control"]
"stakewars-ChallengeSettled" = ["stakewars-control"]
"stakewars-ChallengePositionResolved" = ["stakewars-control"]
"stakewars-OperatorDisqualified" = ["stakewars-control"]
"stakewars-OperatorRetired" = ["stakewars-control"]
