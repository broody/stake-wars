app = "stakewars"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  ARBITER_ACCEPTANCE_DURATION = "15m"
  ARBITER_BIDDING_DURATION = "72h"
  ARBITER_SETTLEMENT_DURATION = "6h"
  DATABASE_PATH = "/data/stakewars.db"
  MAX_IMAGE_BYTES = "2097152"
  PORT = "8080"
  STARKNET_CHAIN_ID = "SN_MAIN"
  CONTROL_SYSTEM_ADDRESS = "0x0769d1726f0421cf5ef9e91f28f3b4b1ba9f818ce0c5f3a5e99202ee1913c5e0"
  TORII_DB_DIR = "/data/torii"
  TORII_CORS_ORIGINS = "https://stakewars.gg,https://play.stakewars.gg"
  TORII_STAKING_POOL_ADDRESS = "0x06ea5688ff1395a4562238880d43500035fb55f2b80546e0e530770378cd1e2e"
  TORII_STAKING_POOL_BLOCK = "12780210"
  TORII_WHISPER_ADDRESS = "0x07e50e2acad557379785d671d6dde25cde4e18714470b6619f764233cc12b509"
  TORII_WHISPER_BLOCK = "14068037"
  TORII_URL = "http://127.0.0.1:8081"
  TORII_WORLD_ADDRESS = "0x06e2d33ac9878de85acc676347f6bd97a860376fe33438eb7445317a6b1d71cc"
  TORII_WORLD_BLOCK = "14066846"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "2s"

[[mounts]]
  source = "stakewars_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
